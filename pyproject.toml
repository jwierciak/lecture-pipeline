[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-pipeline"
version = "1.0.0"
description = "Automated multimodal lecture pipeline with Apple Silicon MLX ASR, OpenCV slide extraction, Gemini note synthesis, and native macOS floating HUD."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jakub Wierciak" }
]
keywords = [
    "lecture-pipeline",
    "apple-silicon",
    "mlx",
    "speech-to-text",
    "parakeet-tdt",
    "gemini-api",
    "obsidian",
    "videotoolbox",
    "macos-hud"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mlx>=0.20.0",
    "parakeet-mlx>=0.4.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

